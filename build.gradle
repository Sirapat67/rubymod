plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.rubymod'

base { archivesName = 'rubymod' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'   // NeoForge for Minecraft 1.21.1

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }

    mods {
        rubymod { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }
